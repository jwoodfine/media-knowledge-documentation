# Canonical category taxonomy for the documentation wiki. Single source of truth. Supersedes the hardcoded RATIFIED_CATEGORIES; see .agent/rules/naming-convention.md §4 and .agent/audit/2026-07-02-category-redesign/proposal-documentation.md.
#
# `kind:` (added 2026-08-04) — sidebar section grouping. topic | guide. Every
# category is `topic` except `how-to`, which is `guide`. This is the single
# source of truth for the sidebar's two-section split (Topics / Guides) —
# the engine must read this field, not hardcode an id check, so a category
# never has to appear in two sections at once (see the how-to duplicate bug
# this replaced) and so a future guide-category split (how-to → several
# real categories) needs zero engine change, only new `kind: guide` entries
# here. `reference` (Glossary and Reference) stays `kind: topic` deliberately
# — it renders inside the Topics section, not its own section, because
# unlike `how-to` it has no near-term plan to become a multi-category family.
wiki: media-knowledge-documentation
audience: >-
  Primary: developers and PointSav engineers. Secondary: the financial
  community — bankers, asset managers, auditors — arriving from the
  corporate knowledge base, who must be able to read every category name
  and scope cold. Article bodies are technical; category names and scopes
  are PointSav speaking plainly.
version: 2026-08-04
companion: >-
  media-knowledge-corporate and media-knowledge-projects carry the
  customer's story — the company and the money; the buildings and the
  places. This knowledge base documents the platform PointSav builds:
  what it is, how it is built, why it can be trusted, and how customers
  run it on their own hardware.

categories:
  - id: architecture
    name: "Architecture"
    kind: topic
    scope: >-
      How the platform is put together: the three-ring build that keeps
      AI optional, the principle that customers own their running
      instance outright, and the business and publication model built on
      that shape.
    audience: "Everyone — first visit; engineers and finance readers"
    order: 1

  - id: substrate
    name: "Core Concepts"
    kind: topic
    scope: >-
      The reusable pieces the platform is built from — the concepts,
      disciplines, and mechanisms that recur in every product. If
      another article names a mechanism, its definition lives here.
    audience: "Engineers; finance readers"
    order: 2

  - id: patterns
    name: "Design Patterns"
    kind: topic
    scope: >-
      The named, repeatable shapes the platform reuses to solve
      coordination, ownership, and interface problems — written up once,
      referenced everywhere.
    audience: "Engineers, designers"
    order: 3

  - id: security
    name: "Security and Trust"
    kind: topic
    scope: >-
      How the platform is protected and how its records are verified:
      identity and permissions, cryptographic verification, isolation
      boundaries, how data is handled and kept private, and the
      supply-chain controls designed to keep code honest.
    audience: "Engineers; auditors and diligence readers"
    order: 4

  - id: ai
    name: "AI and Inference"
    kind: topic
    scope: >-
      Where AI sits and where it is not allowed: the boundary that keeps
      AI away from the authoritative record, the routing between models,
      and the small, customer-side models designed to learn a customer's
      own environment. The core runs fully without it.
    audience: "Engineers; finance readers assessing the AI posture"
    order: 5

  - id: systems
    name: "Operating Systems"
    kind: topic
    scope: >-
      The operating systems PointSav ships — one article per system,
      plus how they are composed and developed.
    audience: "Engineers"
    order: 6

  - id: services
    name: "Platform Services"
    kind: topic
    scope: >-
      The always-on background services — one article per service: what
      it does, what data it owns, and how it connects to the rest.
    audience: "Engineers"
    order: 7

  - id: applications
    name: "Applications"
    kind: topic
    scope: >-
      The applications people actually use — one article per
      application, from the public knowledge sites to the internal
      consoles.
    audience: "Engineers, designers"
    order: 8

  - id: infrastructure
    name: "Infrastructure"
    kind: topic
    scope: >-
      Where the platform physically runs: customer hardware, deployment,
      storage, telemetry, and the shared compute network that pools
      hardware across sites.
    audience: "Engineers; finance readers"
    order: 9

  - id: design-system
    name: "Design System"
    kind: topic
    scope: >-
      How the platform looks and speaks: design philosophy, visual
      vocabulary, and brand surfaces. Component specifications live in
      the design-system repository.
    audience: "Engineers, designers, finance readers"
    order: 10

  - id: governance
    name: "Governance and Standards"
    kind: topic
    scope: >-
      How engineering decisions are made and recorded: decision records,
      licensing and legal structure, disclosure posture, and compliance
      discipline — written for auditors and due-diligence reviewers as
      much as for engineers.
    audience: "Engineers; finance readers, auditors"
    order: 11

  - id: how-to
    name: "Platform Tasks"
    kind: guide
    scope: >-
      Step-by-step instructions for the hands-on work: installing,
      configuring, deploying, and operating the platform. Customers run
      their own instance, so these are written for the customer's
      keyboard, not just PointSav's. Two of guide-catalog.md's 7 real
      thematic groups have moved out of this umbrella category into their
      own — see `self-hosting` and `machine-authorization` below — houses
      the other 5 groups (Getting started, Working in the console, Records
      & storage, Multi-entity scale, Integration & data) until each gets
      the same treatment in a later round.
    audience: "Engineers (hands on keyboard); customer operators"
    order: 12

  - id: self-hosting
    name: "Self-Hosting"
    kind: guide
    scope: >-
      Running platform components on your own infrastructure: booting the
      seL4 appliance images, deploying the wiki engine, configuring the
      inference gateway, and running local inference — the guides that
      cover setting up and operating a deployment end to end, as opposed
      to day-to-day operational work (which stays in "Platform Tasks" for now).
    audience: "Engineers (hands on keyboard); customer operators"
    order: 13

  - id: machine-authorization
    name: "Machine Authorization"
    kind: guide
    scope: >-
      Pairing devices and nodes onto the network, issuing and rotating
      service-to-service capability tokens, and authenticating binary
      downloads — the credential and admission mechanisms that gate who
      and what can act on the platform, as opposed to day-to-day operational
      work (which stays in "Platform Tasks" for now).
    audience: "Engineers (hands on keyboard); network and service operators"
    order: 14

  - id: reference
    name: "Glossary and Reference"
    kind: topic
    scope: >-
      Every term defined in plain words, plus the catalogues and
      standard definitions used across the knowledge base.
    audience: "All readers — consulted, not browsed"
    order: 15
